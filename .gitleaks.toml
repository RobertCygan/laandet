# Gitleaks configuration for this repository: the default rules, plus an allow-list for
# throwaway credentials used only by local development and CI test databases.
[extend]
useDefault = true

[allowlist]
description = "Laandet local/CI test fixtures (no real secrets)"
paths = [
  '''app/tests/''',
  '''app/scripts/db-setup-local\.sh''',
  '''\.github/workflows/laandet-ci\.yml''',
]
